<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京 一時停止・自転車規制マップ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23d62828%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --panel-bg: rgba(255,255,255,.96); --fg: #1d2733; --muted: #5d6b7a; --line: #d9e0e7; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--fg); }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; left: 10px; z-index: 2; width: 300px; max-height: calc(100% - 20px); overflow: auto;
           background: var(--panel-bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.15); font-size: 13px; }
  #panel h1 { font-size: 14px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  #toggle { border: 0; background: none; font-size: 12px; color: var(--muted); cursor: pointer; }
  #layers { padding: 6px 12px 10px; }
  #layers h2 { font-size: 12px; margin: 10px 0 4px; color: var(--muted); font-weight: 600; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; line-height: 1.3; }
  .swatch { width: 18px; height: 10px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.25); }
  .swatch.dot { width: 12px; height: 12px; border-radius: 50%; margin: 0 3px; }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  #note { padding: 8px 12px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.5; }
  #status { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 3; background: #1d2733; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; display: none; }
  .maplibregl-popup-content { font-size: 12px; max-width: 320px; max-height: 320px; overflow: auto; padding: 10px 12px; }
  .popup-title { font-weight: 700; font-size: 13px; margin: 0 0 6px; }
  .popup-item + .popup-item { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
  .popup table { border-collapse: collapse; width: 100%; }
  .popup td { padding: 2px 4px 2px 0; vertical-align: top; word-break: break-all; }
  .popup td:first-child { color: var(--muted); white-space: nowrap; padding-right: 8px; }
  .nodata { color: #b45309; }
  @media (max-width: 600px) { #panel { width: calc(100% - 20px); max-height: 45%; } #panel.collapsed #layers, #panel.collapsed #note { display: none; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1><span>レイヤー</span><button id="toggle" type="button">折りたたむ</button></h1>
  <div id="layers"></div>
  <div id="note">
    <b>矢印</b>は、一時停止で止まる車の進行方向を道路網から推定したものです(点に向かって進む向き)。
    <span style="color:#b91c1c">■</span>高 <span style="color:#ea580c">■</span>中 <span style="color:#9ca3af">■</span>低(信頼度)。
    矢印がない点は、大通り走行中の誤判定を避けるため向きを出していません。
    JARTICの原データには進入方向がほぼ入っていません。<br>
    背景: © OpenStreetMap contributors / 交通規制情報: JARTIC(日本道路交通情報センター)オープンデータ
  </div>
</div>
<div id="status"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script>
(function () {
  'use strict';

  // ---- レイヤー定義 -------------------------------------------------------
  // tiles: data/tiles/{tiles}.pmtiles, id: PMTilesのレイヤー名
  const GROUPS = [
    { title: 'JARTIC(警察の交通規制情報)', layers: [
      { id: 'jartic_stop_dir', label: '一時停止の進入方向(推定・矢印)', tiles: 'jartic', type: 'arrow', srcLayer: 'jartic_stop', color: '#b91c1c', on: true, minzoom: 14 },
      { id: 'jartic_stop', label: '一時停止 (63)', tiles: 'jartic', type: 'point', color: '#d62828', on: true },
      { id: 'jartic_bike_sidewalk_ok', label: '普通自転車歩道通行可 (81)', tiles: 'jartic', type: 'line', color: '#1d4ed8', on: true },
      { id: 'jartic_bike_sidewalk_part', label: '普通自転車の歩道通行部分 (82)', tiles: 'jartic', type: 'line', color: '#06b6d4', on: true },
      { id: 'jartic_bike_no_entry', label: '普通自転車の交差点進入禁止 (83)', tiles: 'jartic', type: 'point', color: '#7e22ce', on: true },
      { id: 'jartic_bike_crossing', label: '自転車横断帯 (87)', tiles: 'jartic', type: 'mixed', color: '#f59e0b', on: true },
      { id: 'jartic_closure_bike', label: '通行止め系(自転車対象)', tiles: 'jartic', type: 'line', color: '#7f1d1d', dash: [2, 1.5], on: true },
    ]},
  ];
  const ALL = GROUPS.flatMap(g => g.layers);

  // ポップアップ用の属性ラベル(表示順)
  const LABELS = {
    regulation: '規制種別', name_pref: '県別名称', intersection: '交差点名', road_name: '路線名', road_type: '道路種別',
    has_direction: 'JARTICの方向情報', dir_status: '向きの推定(信頼度)', dir_text: '推定した向き', dir_bearing: '進行方位(度, 北=0)', dir_basis: '推定の根拠', dir_junction_m: '交差点までの距離(m)', dir_road_class: '停止する道路の種別', dir_road_name: '停止する道路名', dir_cross_class: '交差する道路の種別', dir_cross_name: '交差する道路名', dir_note: '推定できない理由', approach_text: '進入方向(文字)', approach_coords: '進入方向(座標)',
    targets: '対象車両', target_note: '対象車両の備考', excludes: '除外車両', bike_status: '自転車の扱い',
    condition: '規制条件', time_from: '規制時間(開始)', time_to: '規制時間(終了)', weekday_code: '曜日コード',
    side_code: '片側・両側', length_m: '延長(m)', remarks: '備考', revised: '意思決定改正日', unique_key: 'ユニークキー',
    osm_id: 'OSM ID', highway: 'highway', name: '名称', oneway: 'oneway', surface: 'surface', bicycle: 'bicycle', foot: 'foot',
    segregated: 'segregated', cycleway: 'cycleway', 'cycleway:left': 'cycleway:left', 'cycleway:right': 'cycleway:right',
    'cycleway:both': 'cycleway:both', 'oneway:bicycle': 'oneway:bicycle', 'bicycle:forward': 'bicycle:forward',
    'bicycle:backward': 'bicycle:backward', maxspeed: 'maxspeed', direction: 'direction', stop: 'stop', traffic_sign: 'traffic_sign',
  };

  const $ = (id) => document.getElementById(id);
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function status(msg, ms) {
    const el = $('status');
    el.textContent = msg; el.style.display = msg ? 'block' : 'none';
    if (msg && ms) setTimeout(() => { el.style.display = 'none'; }, ms);
  }

  // ---- PMTiles: Range非対応サーバー(python -m http.server)でも動くよう全体取得 ----
  class WholeFileSource {
    constructor(url) { this.url = url; this.buf = null; }
    getKey() { return this.url; }
    async getBytes(offset, length) {
      if (!this.buf) {
        if (!this._p) {
          this._p = fetch(this.url, { cache: 'no-cache' }).then((r) => {
            if (!r.ok) throw new Error(this.url + ' HTTP ' + r.status);
            return r.arrayBuffer();
          });
        }
        this.buf = await this._p;
      }
      return { data: this.buf.slice(offset, offset + length) };
    }
  }
  // Range対応サーバー(GitHub Pages等)なら必要な部分だけ、非対応(python -m http.server)なら全体を取得
  class AutoSource {
    constructor(url) { this.url = url; this.mode = null; this.whole = new WholeFileSource(url); this.ranged = new pmtiles.FetchSource(url); }
    getKey() { return this.url; }
    async getBytes(offset, length, signal, etag) {
      if (!this.mode) {
        try {
          const r = await fetch(this.url, { headers: { Range: 'bytes=0-0' } });
          this.mode = r.status === 206 ? 'range' : 'whole';
        } catch (e) { this.mode = 'whole'; }
      }
      return this.mode === 'range' ? this.ranged.getBytes(offset, length, signal, etag) : this.whole.getBytes(offset, length);
    }
  }
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);
  const tileSets = ['jartic'];
  const tileUrl = (n) => new URL('data/tiles/' + n + '.pmtiles', location.href).href;
  tileSets.forEach((n) => protocol.add(new pmtiles.PMTiles(new AutoSource(tileUrl(n)))));

  // ---- 地図 ---------------------------------------------------------------
  function paintFor(l) {
    if (l.type === 'point') {
      return { type: 'circle', paint: {
        'circle-color': l.color,
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 1.5, 14, 4, 18, 8],
        'circle-stroke-color': '#fff', 'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 12, 0, 15, 1],
        'circle-opacity': 0.9 } };
    }
    const paint = { 'line-color': l.color, 'line-opacity': 0.9,
                    'line-width': ['interpolate', ['linear'], ['zoom'], 10, 1, 14, 2.5, 18, 6] };
    if (l.dash) paint['line-dasharray'] = l.dash;
    return { type: 'line', paint, layout: { 'line-cap': 'round', 'line-join': 'round' } };
  }

  // mixed は線と点の両方を持つレイヤー。線用は l.id、点用は l.id + '_pt'
  const layerIds = (l) => (l.type === 'mixed' ? [l.id, l.id + '_pt'] : [l.id]);
  const styleLayers = [{ id: 'basemap', type: 'raster', source: 'osm' }];
  const ARROW_COLOR = ['match', ['get', 'dir_status'], '高', '#b91c1c', '中', '#ea580c', '低', '#9ca3af', '#9ca3af'];
  const mkLayer = (l, id, kind, filter) => {
    if (kind === 'arrow') {
      // 推定した進行方位(dir_bearing)で回転する矢印。矢じりが停止位置、尾が手前(車が来る側)
      return { id, source: 'jartic', 'source-layer': l.srcLayer, type: 'symbol', minzoom: l.minzoom || 0,
        filter: ['has', 'dir_bearing'],
        layout: { visibility: l.on ? 'visible' : 'none',
          'icon-image': ['concat', 'arrow-', ['get', 'dir_status']],
          'icon-rotate': ['get', 'dir_bearing'], 'icon-rotation-alignment': 'map', 'icon-pitch-alignment': 'map',
          'icon-anchor': 'top', 'icon-allow-overlap': true, 'icon-ignore-placement': true,
          'icon-size': ['interpolate', ['linear'], ['zoom'], 14, 0.22, 16, 0.4, 18, 0.7, 19, 1] } };
    }
    const p = paintFor(Object.assign({}, l, { type: kind }));
    const def = { id, source: 'jartic', 'source-layer': l.id, type: p.type,
      paint: p.paint, layout: Object.assign({ visibility: l.on ? 'visible' : 'none' }, p.layout || {}) };
    if (filter) def.filter = filter;
    return def;
  };
  // 並べる順: 線を下、点を上
  ALL.filter((l) => l.type === 'line').forEach((l) => styleLayers.push(mkLayer(l, l.id, 'line')));
  ALL.filter((l) => l.type === 'mixed').forEach((l) =>
    styleLayers.push(mkLayer(l, l.id, 'line', ['==', ['geometry-type'], 'LineString'])));
  ALL.filter((l) => l.type === 'arrow').forEach((l) => styleLayers.push(mkLayer(l, l.id, 'arrow')));
  ALL.filter((l) => l.type === 'point').forEach((l) => styleLayers.push(mkLayer(l, l.id, 'point')));
  ALL.filter((l) => l.type === 'mixed').forEach((l) =>
    styleLayers.push(mkLayer(l, l.id + '_pt', 'point', ['==', ['geometry-type'], 'Point'])));

  const map = new maplibregl.Map({
    container: 'map',
    center: [139.7671, 35.6812], zoom: 11.5, maxZoom: 19,
    style: {
      version: 8,
      sources: {
        osm: { type: 'raster', tileSize: 256, maxzoom: 19,
               tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
               attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' },
        jartic: { type: 'vector', url: 'pmtiles://' + tileUrl('jartic'),
                  attribution: '交通規制情報: <a href="https://www.jartic.or.jp/service/opendata/">JARTIC</a>' },
      },
      layers: styleLayers,
    },
  });
  window.map = map; // デバッグ・動作確認用
  const ARROW_COLORS = { '高': '#b91c1c', '中': '#ea580c', '低': '#9ca3af' };
  map.on('styleimagemissing', (e) => {
    const m = /^arrow-(.+)$/.exec(e.id);
    if (!m || !ARROW_COLORS[m[1]]) return;
    const w = 40, hgt = 72, c = document.createElement('canvas'); c.width = w; c.height = hgt;
    const g = c.getContext('2d');
    g.beginPath();  // 上向きの矢印。矢じり(上端)が停止位置
    g.moveTo(w / 2, 2); g.lineTo(w - 3, 26); g.lineTo(w / 2 + 6, 26); g.lineTo(w / 2 + 6, hgt - 2);
    g.lineTo(w / 2 - 6, hgt - 2); g.lineTo(w / 2 - 6, 26); g.lineTo(3, 26); g.closePath();
    g.fillStyle = ARROW_COLORS[m[1]]; g.fill(); g.lineWidth = 3; g.strokeStyle = '#fff'; g.stroke();
    map.addImage(e.id, g.getImageData(0, 0, w, hgt), { pixelRatio: 1 });
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

  buildPanel();
  loadCounts();

  map.on('error', (e) => {
    const msg = (e && e.error && e.error.message) || '';
    if (/pmtiles|HTTP/i.test(msg)) status('タイル読み込みエラー: ' + msg, 6000);
  });

  // ---- パネル(ON/OFFチェックボックス) --------------------------------------
  function buildPanel() {
    const root = $('layers');
    GROUPS.forEach((g) => {
      const h = document.createElement('h2'); h.textContent = g.title; root.appendChild(h);
      g.layers.forEach((l) => {
        const row = document.createElement('label'); row.className = 'row';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = l.on; cb.dataset.layer = l.id;
        cb.addEventListener('change', () => {
          layerIds(l).forEach((id) => map.setLayoutProperty(id, 'visibility', cb.checked ? 'visible' : 'none'));
        });
        const sw = document.createElement('span'); sw.className = 'swatch' + (l.type === 'point' ? ' dot' : '');
        sw.style.background = l.color;
        const text = document.createElement('span'); text.textContent = l.label;
        const cnt = document.createElement('span'); cnt.className = 'count'; cnt.id = 'count-' + l.id;
        row.append(cb, sw, text, cnt);
        root.appendChild(row);
      });
    });
  }
  function loadCounts() {
    fetch('data/quality_report.json').then((r) => (r.ok ? r.json() : null)).then((q) => {
      if (!q) return;
      Object.keys(q.layers || {}).forEach((k) => {
        const el = $('count-' + k);
        if (el) el.textContent = q.layers[k].count ? q.layers[k].count.toLocaleString('ja-JP') + '件' : '0件(東京都データなし)';
      });
    }).catch(() => {});
  }
  $('toggle').addEventListener('click', () => {
    const p = $('panel'); p.classList.toggle('collapsed');
    const c = p.classList.contains('collapsed');
    $('layers').style.display = c ? 'none' : ''; $('note').style.display = c ? 'none' : '';
    $('toggle').textContent = c ? '開く' : '折りたたむ';
  });

  // ---- クリックで属性ポップアップ ---------------------------------------------
  function activeIds() {
    return ALL.filter((l) => l.type !== 'arrow').flatMap(layerIds).filter((id) => map.getLayer(id) && map.getLayoutProperty(id, 'visibility') === 'visible');
  }
  function renderFeature(f) {
    const def = ALL.find((l) => l.id === f.layer['source-layer']);
    const p = Object.assign({}, f.properties);
    // 一時停止: 方向情報の有無を明示する
    if (f.layer['source-layer'] === 'jartic_stop') {
      const has = p.has_direction === true || p.has_direction === 'true';
      p.has_direction = has ? 'あり' : 'なし(原データ)';
    }
    const order = Object.keys(LABELS);
    const keys = order.filter((k) => p[k] !== undefined && p[k] !== null && p[k] !== '')
      .concat(Object.keys(p).filter((k) => !(k in LABELS) && k !== 'code'));
    const rows = keys.map((k) => {
      const cls = (k === 'has_direction' && p[k] === 'なし(原データ)') ? ' class="nodata"' : '';
      return '<tr><td>' + esc(LABELS[k] || k) + '</td><td' + cls + '>' + esc(p[k]) + '</td></tr>';
    }).join('');
    const osm = p.osm_id ? ' <a href="https://www.openstreetmap.org/' + esc(p.osm_id) + '" target="_blank" rel="noopener">OSMで開く</a>' : '';
    return '<div class="popup-item"><div class="popup-title">' + esc(def ? def.label : f.layer['source-layer']) + '</div><table>' + rows + '</table>' + osm + '</div>';
  }
  map.on('click', (e) => {
    const visible = activeIds();
    const r = 6;
    const feats = map.queryRenderedFeatures([[e.point.x - r, e.point.y - r], [e.point.x + r, e.point.y + r]], { layers: visible });
    if (!feats.length) return;
    // 同一フィーチャの重複(タイル境界)を除く
    const seen = new Set(); const uniq = [];
    feats.forEach((f) => {
      const key = f.layer['source-layer'] + '|' + (f.properties.unique_key || f.properties.osm_id || JSON.stringify(f.geometry.coordinates).slice(0, 80));
      if (!seen.has(key)) { seen.add(key); uniq.push(f); }
    });
    const shown = uniq.slice(0, 8);
    const more = uniq.length > shown.length ? '<div class="popup-item">ほか ' + (uniq.length - shown.length) + ' 件(拡大すると絞れます)</div>' : '';
    new maplibregl.Popup({ maxWidth: '340px' }).setLngLat(e.lngLat)
      .setHTML('<div class="popup">' + shown.map(renderFeature).join('') + more + '</div>').addTo(map);
  });
  map.on('mousemove', (e) => {
    const visible = activeIds();
    map.getCanvas().style.cursor = map.queryRenderedFeatures(e.point, { layers: visible }).length ? 'pointer' : '';
  });
})();
</script>
</body>
</html>
